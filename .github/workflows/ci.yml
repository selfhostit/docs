name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: shellcheck -s sh install.sh
      - run: sh -n install.sh
      - run: shellcheck -s sh selfhostit
      - run: sh -n selfhostit
