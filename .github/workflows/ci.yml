name: ci
on:
  push:
    branches: [main]
  pull_request:
  # weekly, to notice a pinned file that changed on GitHub or an app with a newer release
  schedule:
    - cron: '7 6 * * 1'

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: shellcheck -s sh install.sh selfhostit scripts/pin-apps.sh scripts/release-apps.sh
      - run: sh -n install.sh && sh -n selfhostit && sh -n scripts/pin-apps.sh && sh -n scripts/release-apps.sh

  # Every file install.sh downloads must still have the SHA-256 it pins.
  pins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: scripts/pin-apps.sh --check
