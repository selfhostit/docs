name: release

# Publishes a release of the installer: install.sh and the selfhostit command as
# downloads, their SHA-256 sums, and a signed attestation of the workflow and commit
# they came from. People install from
# https://github.com/selfhostit/docs/releases/latest/download/install.sh.
#
# It runs every hour by itself: when an app has a newer release than install.sh pins,
# and that release's images are built, it re-pins install.sh on main and publishes the
# next installer patch release. So after `scripts/release-apps.sh` (or a hand-made app
# release) there is nothing else to do. To release by hand:
#
#   gh workflow run release.yml --repo selfhostit/docs                    # re-pin if needed, next patch
#   gh workflow run release.yml --repo selfhostit/docs -f version=v1.2.0  # a version of your choice
#
# Releases are immutable, so the files go in when the release is created.
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      version:
        description: Version tag, like v1.2.0 (empty for the next patch release)
        required: false

permissions:
  contents: read

concurrency:
  group: release

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # to push the new pins, and create the release and its tag
      actions: write # to start the release run on the new pins
      id-token: write # to sign the attestation
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Re-pin the apps
        id: pin
        run: |
          scripts/pin-apps.sh
          if git diff --quiet install.sh; then
            echo "The pins are up to date."
            echo "changed=n" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Pin only releases whose CI run (the signed image build) has succeeded.
          git diff -U0 install.sh | sed -n 's/^+\t\([^ ]*\) \([^ ]*\) .*/\1 \2/p' | sort -u |
            while read -r app tag; do
              result=$(gh run list --repo "selfhostit/$app" --workflow CI --branch "$tag" --limit 1 \
                --json status,conclusion -q '.[0] | "\(.status) \(.conclusion)"')
              echo "$app $tag: ${result:-no build}"
              case $result in
              "completed success") ;;
              completed*) echo "::error::the $app $tag build failed; release a fixed version"; exit 1 ;;
              *) echo "still building; trying again next hour"; exit 2 ;;
              esac
            done || { [ $? = 2 ] && echo "changed=wait" >> "$GITHUB_OUTPUT" && exit 0; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "Pin the installer to the new app releases" install.sh
          git push origin HEAD:main
          # Release from a fresh run on the new commit, so the attestation names it.
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref main -f version="$VERSION"
          echo "changed=y" >> "$GITHUB_OUTPUT"
        env:
          VERSION: ${{ inputs.version }}

      - name: Pick the version
        id: version
        if: github.event_name == 'workflow_dispatch' && steps.pin.outputs.changed == 'n'
        run: |
          if [ -z "$VERSION" ]; then
            last=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName 2>/dev/null || true)
            if [ -n "$last" ]; then
              VERSION=$(echo "$last" | awk -F. '{ printf "%s.%s.%d\n", $1, $2, $3 + 1 }')
            else
              VERSION=v1.0.0
            fi
          fi
          echo "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' || { echo "not a version like v1.2.0: $VERSION"; exit 1; }
          echo "Releasing $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        env:
          VERSION: ${{ inputs.version }}

      - name: Check the pinned app files
        if: steps.version.outputs.version
        run: scripts/pin-apps.sh --check
      - name: SHA-256 sums
        if: steps.version.outputs.version
        run: sha256sum install.sh selfhostit > SHA256SUMS && cat SHA256SUMS
      - name: Attest the files
        if: steps.version.outputs.version
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            install.sh
            selfhostit
      - name: Publish the release
        if: steps.version.outputs.version
        run: |
          gh release create "$VERSION" install.sh selfhostit SHA256SUMS \
            --target "$GITHUB_SHA" --title "Installer $VERSION" --generate-notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
