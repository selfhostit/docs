<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 420" width="1180" height="420" role="img" aria-labelledby="t d">
<title id="t">Put selfhostit apps on your phones with Tailscale</title><desc id="d">Optional: say yes to Tailscale in the installer and sign in with its link, install the Tailscale app on each phone with the same account, then open each app's https address and add it to the home screen.</desc>
<defs><filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1f2340" flood-opacity=".14"/></filter></defs>
<g transform="translate(0 0)"><linearGradient id="gd" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e6f7f4"/><stop offset="1" stop-color="#d2efea"/></linearGradient><rect width="380" height="420" rx="28" fill="url(#gd)"/><rect x="24" y="24" width="34" height="34" rx="11" fill="#0f9f8f"/><text x="41" y="47" font-family="Inter,'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="70" y="48" font-family="Inter,'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif" font-size="21" font-weight="700" fill="#1f2340" text-anchor="start">Say yes to Tailscale</text><g transform="translate(0 19)"><rect x="28" y="78" width="324" height="100" rx="16" fill="#1c1f33" filter="url(#sh)" /><text x="46" y="106" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="14" font-weight="500" fill="#d6dafc" text-anchor="start">Set up Tailscale? (y/n) y</text><text x="46" y="130" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="14" font-weight="500" fill="#d6dafc" text-anchor="start">Sign in by opening this link:</text><text x="46" y="154" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="14" font-weight="500" fill="#7fd6ff" text-anchor="start">https://login.tailscale.com/…</text><path d="M46 159 L262 159" stroke="#7fd6ff" stroke-width="1.5"/><rect x="98" y="214" width="184" height="70" rx="14" fill="#fff" filter="url(#sh)" /><text x="190" y="244" font-family="Inter,'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="500" fill="#5b6080" text-anchor="middle">Sign in or make a</text><text x="190" y="264" font-family="Inter,'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="500" fill="#5b6080" text-anchor="middle">free account</text><circle cx="272" cy="220" r="13" fill="#0f9f8f"/><path d="M266 220 l4 4 l8 -8" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/></g><rect x="16" y="338" width="348" height="66" rx="18" fill="#fff" opacity=".82"/><text x="190.0" y="365" font-family="Inter,'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="500" fill="#5b6080" text-anchor="middle">The installer runs Tailscale for all your apps.</text><text x="190.0" y="386" font-family="Inter,'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="500" fill="#5b6080" text-anchor="middle">You only open its link and sign in.</text></g>
<g transform="translate(400 0)"><linearGradient id="ge" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e6f7f4"/><stop offset="1" stop-color="#d2efea"/></linearGradient><rect width="380" height="420" rx="28" fill="url(#ge)"/><rect x="24" y="24" width="34" height="34" rx="11" fill="#0f9f8f"/><text x="41" y="47" font-family="Inter,'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">5</text><text x="70" y="48" font-family="Inter,'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif" font-size="21" font-weight="700" fill="#1f2340" text-anchor="start">Get it on each phone</text><g transform="translate(-66 18)"><rect x="200" y="82" width="112" height="200" rx="20" fill="#20243a" filter="url(#sh)"/><rect x="206" y="88" width="100" height="188" rx="15" fill="#fff"/><rect x="240.0" y="93" width="32" height="6" rx="3" fill="#20243a"/><rect x="220" y="118" width="72" height="72" rx="18" fill="#0f9f8f"/><circle cx="238" cy="136" r="4.5" fill="#fff" opacity="0.45"/><circle cx="256" cy="136" r="4.5" fill="#fff" opacity="0.45"/><circle cx="274" cy="136" r="4.5" fill="#fff" opacity="0.45"/><circle cx="238" cy="154" r="4.5" fill="#fff" opacity="1"/><circle cx="256" cy="154" r="4.5" fill="#fff" opacity="1"/><circle cx="274" cy="154" r="4.5" fill="#fff" opacity="1"/><circle cx="238" cy="172" r="4.5" fill="#fff" opacity="0.45"/><circle cx="256" cy="172" r="4.5" fill="#fff" opacity="1"/><circle cx="274" cy="172" r="4.5" fill="#fff" opacity="0.45"/><text x="256" y="214" font-family="Inter,'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#1f2340" text-anchor="middle">Tailscale</text><rect x="222" y="226" width="68" height="28" rx="14" fill="#3b82f6"/><text x="256" y="245" font-family="Inter,'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">Get</text></g><rect x="16" y="338" width="348" height="66" rx="18" fill="#fff" opacity=".82"/><text x="190.0" y="365" font-family="Inter,'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="500" fill="#5b6080" text-anchor="middle">Install the Tailscale app from the app store</text><text x="190.0" y="386" font-family="Inter,'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="500" fill="#5b6080" text-anchor="middle">and sign in with the same account.</text></g>
<g transform="translate(800 0)"><linearGradient id="gf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e6f7f4"/><stop offset="1" stop-color="#d2efea"/></linearGradient><rect width="380" height="420" rx="28" fill="url(#gf)"/><rect x="24" y="24" width="34" height="34" rx="11" fill="#0f9f8f"/><text x="41" y="47" font-family="Inter,'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">6</text><text x="70" y="48" font-family="Inter,'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif" font-size="21" font-weight="700" fill="#1f2340" text-anchor="start">Add them to your phone</text><g transform="translate(-45 10)"><rect x="196" y="82" width="124" height="216" rx="20" fill="#20243a" filter="url(#sh)"/><rect x="202" y="88" width="112" height="204" rx="15" fill="#fff"/><rect x="242.0" y="93" width="32" height="6" rx="3" fill="#20243a"/><rect x="206" y="112" width="104" height="18" rx="9" fill="#eef0f7"/><text x="258" y="125" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10.5" font-weight="500" fill="#5b6080" text-anchor="middle">https://…ts.net</text><rect x="216" y="146" width="38" height="38" rx="11" fill="#2ea44f"/><rect x="264" y="146" width="38" height="38" rx="11" fill="#f2a93b"/><rect x="216" y="196" width="38" height="38" rx="11" fill="#e5508a"/><rect x="264" y="196" width="38" height="38" rx="11" fill="#3b82f6"/><rect x="150" y="250" width="150" height="40" rx="12" fill="#fff" filter="url(#sh)" /><circle cx="170" cy="270" r="8" fill="#e5508a"/><text x="184" y="275" font-family="Inter,'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#1f2340" text-anchor="start">Period in 2 days</text></g><rect x="16" y="338" width="348" height="66" rx="18" fill="#fff" opacity=".82"/><text x="190.0" y="365" font-family="Inter,'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="500" fill="#5b6080" text-anchor="middle">Open each app's https:// address, then</text><text x="190.0" y="386" font-family="Inter,'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="500" fill="#5b6080" text-anchor="middle">Add to Home Screen. Home or away.</text></g>
</svg>
