<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 420" width="1180" height="420" role="img" aria-labelledby="t d">
<title id="t">Install selfhostit apps in three steps</title><desc id="d">A person finds an old laptop or a Raspberry Pi, pastes one install line in a terminal and picks apps, then opens every app in a browser at home.</desc>
<defs><filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1f2340" flood-opacity=".14"/></filter></defs>
<g transform="translate(0 0)"><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eef0ff"/><stop offset="1" stop-color="#dfe3ff"/></linearGradient><rect width="380" height="420" rx="28" fill="url(#ga)"/><rect x="24" y="24" width="34" height="34" rx="11" fill="#5b5bd6"/><text x="41" y="47" font-family="Inter,'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="70" y="48" font-family="Inter,'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif" font-size="21" font-weight="700" fill="#1f2340" text-anchor="start">Find a little computer*</text><g transform="translate(0 0)"><rect x="44" y="140" width="140" height="92" rx="10" fill="#2a2e45" filter="url(#sh)"/><rect x="52" y="148" width="124" height="78" rx="5" fill="#e8ecfb"/><path d="M28 232 L200 232 L190 244 L38 244 Z" fill="#c9cede"/><text x="114" y="190" font-family="Inter,'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#5b6080" text-anchor="middle">old laptop</text><g transform="translate(234 168) scale(1)"><rect width="96" height="64" rx="8" fill="#2ea44f"/><rect x="20" y="18" width="26" height="26" rx="3" fill="#1d2b22"/><circle cx="10.0" cy="7" r="2.2" fill="#ffd166"/><circle cx="18.5" cy="7" r="2.2" fill="#ffd166"/><circle cx="27.0" cy="7" r="2.2" fill="#ffd166"/><circle cx="35.5" cy="7" r="2.2" fill="#ffd166"/><circle cx="44.0" cy="7" r="2.2" fill="#ffd166"/><circle cx="52.5" cy="7" r="2.2" fill="#ffd166"/><circle cx="61.0" cy="7" r="2.2" fill="#ffd166"/><circle cx="69.5" cy="7" r="2.2" fill="#ffd166"/><circle cx="78.0" cy="7" r="2.2" fill="#ffd166"/><circle cx="86.5" cy="7" r="2.2" fill="#ffd166"/><rect x="72" y="22" width="30" height="20" rx="3" fill="#c7ccd6"/><rect x="58" y="48" width="14" height="10" rx="2" fill="#c7ccd6"/></g><text x="282" y="262" font-family="Inter,'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#5b6080" text-anchor="middle">Raspberry Pi 3+</text></g><rect x="16" y="338" width="348" height="66" rx="18" fill="#fff" opacity=".82"/><text x="190.0" y="365" font-family="Inter,'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="500" fill="#5b6080" text-anchor="middle">An old laptop, a mini PC, a NAS or a Pi.</text><text x="190.0" y="386" font-family="Inter,'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="500" fill="#5b6080" text-anchor="middle">On a Pi, Raspberry Pi Imager puts Linux on it.</text></g>
<g transform="translate(400 0)"><linearGradient id="gb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eef0ff"/><stop offset="1" stop-color="#dfe3ff"/></linearGradient><rect width="380" height="420" rx="28" fill="url(#gb)"/><rect x="24" y="24" width="34" height="34" rx="11" fill="#5b5bd6"/><text x="41" y="47" font-family="Inter,'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="70" y="48" font-family="Inter,'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif" font-size="21" font-weight="700" fill="#1f2340" text-anchor="start">Paste one line</text><g transform="translate(0 70)"><rect x="28" y="78" width="324" height="104" rx="16" fill="#1c1f33" filter="url(#sh)" /><circle cx="48" cy="94" r="5" fill="#ff5f57"/><circle cx="64" cy="94" r="5" fill="#febc2e"/><circle cx="80" cy="94" r="5" fill="#28c840"/><text x="46" y="120" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="14" font-weight="500" fill="#9ef0b4" text-anchor="start">$ curl -fsSL …/install.sh | sh</text><text x="46" y="142" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="14" font-weight="500" fill="#d6dafc" text-anchor="start">Which apps? 1 2 3</text><text x="46" y="164" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="14" font-weight="500" fill="#d6dafc" text-anchor="start">Starting Splitwiz… ✓</text></g><rect x="16" y="338" width="348" height="66" rx="18" fill="#fff" opacity=".82"/><text x="190.0" y="365" font-family="Inter,'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="500" fill="#5b6080" text-anchor="middle">In a terminal on it, or over SSH. It installs</text><text x="190.0" y="386" font-family="Inter,'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="500" fill="#5b6080" text-anchor="middle">Docker and asks which apps you want.</text></g>
<g transform="translate(800 0)"><linearGradient id="gc" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eef0ff"/><stop offset="1" stop-color="#dfe3ff"/></linearGradient><rect width="380" height="420" rx="28" fill="url(#gc)"/><rect x="24" y="24" width="34" height="34" rx="11" fill="#5b5bd6"/><text x="41" y="47" font-family="Inter,'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="70" y="48" font-family="Inter,'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif" font-size="21" font-weight="700" fill="#1f2340" text-anchor="start">Open them at home</text><g transform="translate(0 68)"><rect x="30" y="78" width="320" height="108" rx="16" fill="#fff" filter="url(#sh)" /><rect x="30" y="78" width="320" height="34" rx="16" fill="#eef0f7"/><rect x="30" y="96" width="320" height="16" fill="#eef0f7"/><rect x="46" y="86" width="230" height="20" rx="10" fill="#fff"/><text x="58" y="101" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="12.5" font-weight="500" fill="#5b6080" text-anchor="start">http://homeserver:8090</text><rect x="56" y="122" width="36" height="36" rx="11" fill="#2ea44f"/><text x="74" y="176" font-family="Inter,'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#1f2340" text-anchor="middle">Splitwiz</text><rect x="134" y="122" width="36" height="36" rx="11" fill="#f2a93b"/><text x="152" y="176" font-family="Inter,'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#1f2340" text-anchor="middle">should-we</text><rect x="212" y="122" width="36" height="36" rx="11" fill="#e5508a"/><text x="230" y="176" font-family="Inter,'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#1f2340" text-anchor="middle">Flowy</text><rect x="290" y="122" width="36" height="36" rx="11" fill="#3b82f6"/><text x="308" y="176" font-family="Inter,'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#1f2340" text-anchor="middle">Troye</text></g><rect x="16" y="338" width="348" height="66" rx="18" fill="#fff" opacity=".82"/><text x="190.0" y="365" font-family="Inter,'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="500" fill="#5b6080" text-anchor="middle">Every app works in a browser on your</text><text x="190.0" y="386" font-family="Inter,'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="500" fill="#5b6080" text-anchor="middle">home network right away. Done!</text></g>
</svg>
